  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const duration = 2.6;
    const intakeX = 540;
    const intakeY = 1148;
    const typeSequence = [
      { t: 0.0, text: "", segment: "idle", color: "#d4f9ef" },
      { t: 0.08, text: "one", segment: "main", color: "#d4f9ef" },
      { t: 0.17, text: "one mo", segment: "main", color: "#d4f9ef" },
      { t: 0.28, text: "one more", segment: "main", color: "#d4f9ef" },
      { t: 0.36, text: "one more tw", segment: "edit", color: "#18b98b" },
      { t: 0.43, text: "one more t", segment: "edit", color: "#18b98b" },
      { t: 0.52, text: "one more tweak_", segment: "done", color: "#18b98b" }
    ];
    const typeChanges = typeSequence
      .filter((entry, index) => index > 0 && entry.text !== typeSequence[index - 1].text)
      .map((entry) => entry.t);
    const typeDriver = { t: 0 };
    const blinkDriver = { p: 0 };
    const typedEl = document.getElementById("frame-01-prompt-intake-typed");
    const caretEl = document.getElementById("frame-01-prompt-intake-caret");

    const typeEntryAt = (time) => {
      for (let index = typeSequence.length - 1; index >= 0; index -= 1) {
        if (time >= typeSequence[index].t) return typeSequence[index];
      }
      return typeSequence[0];
    };

    tl.to(
      typeDriver,
      {
        t: duration,
        duration,
        ease: "none",
        onUpdate: () => {
          const entry = typeEntryAt(typeDriver.t);
          typedEl.textContent = entry.text;
          caretEl.style.background = entry.color;
          const isTyping = typeChanges.some(
            (changeTime) => changeTime <= typeDriver.t && typeDriver.t - changeTime < 0.07
          );
          caretEl.style.opacity = isTyping || Math.sin(blinkDriver.p) > 0 ? "1" : "0";
        }
      },
      0
    );

    tl.to(
      blinkDriver,
      {
        p: Math.PI * 2 * 4,
        duration,
        ease: "none"
      },
      0
    );

    const promptContent = [
      { id: "#frame-01-prompt-intake-prompt-a", text: "make it work" },
      { id: "#frame-01-prompt-intake-prompt-b", text: "fix this" },
      { id: "#frame-01-prompt-intake-prompt-c", text: "ship it" }
    ];
    let promptCursor = 0.55;
    const promptSchedule = promptContent.map((entry) => {
      const start = promptCursor;
      promptCursor += 0.19 + entry.text.length * 0.006;
      return { ...entry, start };
    });

    promptSchedule.forEach((entry, index) => {
      const fragment = document.querySelector(entry.id);
      const laneX = Number(fragment.dataset.laneX);
      const laneY = Number(fragment.dataset.laneY);
      const baseX = Number(fragment.dataset.baseX);
      const baseY = Number(fragment.dataset.baseY);
      const targetX = intakeX - baseX;
      const targetY = intakeY - baseY;
      const moveDuration = 0.38;

      tl.fromTo(
        fragment,
        { x: laneX, y: laneY, opacity: 0 },
        {
          x: 0,
          y: 0,
          opacity: 1,
          duration: moveDuration,
          ease: index === 0 ? "power4.out" : index === 1 ? "expo.out" : "circ.out"
        },
        entry.start
      );

      fragment.querySelectorAll(".frame-01-prompt-intake-echo").forEach((echo) => {
        const echoIndex = Number(echo.dataset.echo);
        tl.fromTo(
          echo,
          {
            x: laneX < 0 ? -echoIndex * 28 : laneX > 0 ? echoIndex * 28 : 0,
            y: laneY > 100 ? echoIndex * 28 : 0,
            opacity: 0.42 / echoIndex
          },
          {
            x: 0,
            y: 0,
            opacity: 0,
            duration: moveDuration,
            ease: "power4.out"
          },
          entry.start
        );
      });

      tl.to(
        fragment,
        {
          x: targetX * 0.09,
          y: targetY * 0.09,
          duration: Math.max(0.18, 1.45 - entry.start - moveDuration),
          ease: "power1.inOut"
        },
        entry.start + moveDuration
      );

      tl.to(
        fragment,
        {
          x: targetX,
          y: targetY,
          scale: 0.08,
          opacity: 0,
          duration: 0.43,
          ease: "power3.in"
        },
        1.45 + index * 0.045
      );
    });

    tl.to(
      "#frame-01-prompt-intake-type-row",
      {
        x: intakeX - 98,
        y: intakeY - 414,
        scale: 0.08,
        opacity: 0,
        duration: 0.48,
        ease: "power3.in"
      },
      1.45
    );

    tl.fromTo(
      "#frame-01-prompt-intake-intake",
      { scale: 0.72, opacity: 0 },
      { scale: 1, opacity: 1, duration: 0.38, ease: "power3.out" },
      0.82
    );

    tl.to(
      "#frame-01-prompt-intake-ground",
      { backgroundColor: "#f5f0e5", duration: 0.13, ease: "none" },
      1.61
    );
    tl.to(
      ".frame-01-prompt-intake-reg",
      { color: "#0b1113", opacity: 0.28, duration: 0.13, ease: "none" },
      1.61
    );

    const pulse = 0.2;
    const beats = [pulse * 8.2, pulse * 9.15, pulse * 10.1];
    tl.fromTo(
      "#frame-01-prompt-intake-line-1",
      { scale: 1.45, filter: "blur(10px)", opacity: 0 },
      {
        scale: 1,
        filter: "blur(0px)",
        opacity: 1,
        duration: 0.32,
        ease: "power4.out"
      },
      beats[0]
    );
    tl.fromTo(
      "#frame-01-prompt-intake-line-2",
      { x: 260, opacity: 0 },
      { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" },
      beats[1]
    );
    tl.fromTo(
      "#frame-01-prompt-intake-line-3",
      { y: 88, rotation: 4, opacity: 0 },
      { y: 0, rotation: 0, opacity: 1, duration: 0.3, ease: "circ.out" },
      beats[2]
    );

    tl.to(
      "#frame-01-prompt-intake-jaw-top",
      { y: 31, duration: 0.14, ease: "power4.in" },
      2.18
    );
    tl.to(
      "#frame-01-prompt-intake-jaw-bottom",
      { y: -31, duration: 0.14, ease: "power4.in" },
      2.18
    );
    tl.to(
      "#frame-01-prompt-intake-intake",
      { scaleY: 0.1, opacity: 0, duration: 0.14, ease: "power4.in" },
      2.18
    );

    tl.to(
      "#frame-01-prompt-intake-headline",
      {
        scale: 0.8,
        filter: "blur(10px)",
        opacity: 0.15,
        duration: 0.16,
        ease: "power3.in"
      },
      2.09
    );
    tl.set("#frame-01-prompt-intake-headline", { opacity: 0 }, 2.25);
    tl.set(
      "#frame-01-prompt-intake-question",
      { opacity: 0.15, scale: 1.25, filter: "blur(10px)" },
      2.25
    );
    tl.to(
      "#frame-01-prompt-intake-question",
      {
        opacity: 1,
        scale: 1,
        filter: "blur(0px)",
        duration: 0.22,
        ease: "expo.out"
      },
      2.25
    );

    tl.fromTo(
      "#frame-01-prompt-intake-spike",
      { opacity: 0, scale: 0.92 },
      { opacity: 1, scale: 1, duration: 0.07, ease: "power4.out" },
      2.25
    );
    tl.to(
      "#frame-01-prompt-intake-spike",
      { opacity: 0, duration: 0.08, ease: "none" },
      2.34
    );

    window.__timelines["01-prompt-intake"] = tl;
  </script>
