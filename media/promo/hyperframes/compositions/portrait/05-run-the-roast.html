  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "05-run-the-roast";
      const cast = Array.from(document.querySelectorAll(".f05-run-the-roast-cast"));
      const wordmarkStage = document.getElementById("f05-run-the-roast-wordmark-stage");
      const wordmark = document.getElementById("f05-run-the-roast-wordmark");
      const rail = document.getElementById("f05-run-the-roast-rail");
      const sweep = document.getElementById("f05-run-the-roast-sweep");
      const terminal = document.getElementById("f05-run-the-roast-terminal");
      const chip = document.getElementById("f05-run-the-roast-chip");
      const command = document.getElementById("f05-run-the-roast-command");
      const caret = document.getElementById("f05-run-the-roast-caret");
      const proof = document.getElementById("f05-run-the-roast-proof");

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      const castTargets = {
        tl: { x: -720, y: -390 },
        tr: { x: 720, y: -390 },
        bl: { x: -720, y: 390 },
        br: { x: 720, y: 390 }
      };
      const blurNodes = {
        tl: document.getElementById("f05-run-the-roast-blur-tl-node"),
        tr: document.getElementById("f05-run-the-roast-blur-tr-node"),
        bl: document.getElementById("f05-run-the-roast-blur-bl-node"),
        br: document.getElementById("f05-run-the-roast-blur-br-node")
      };

      cast.forEach((panel) => {
        const key = panel.dataset.castKey;
        const target = castTargets[key];
        const blurProxy = { x: 0, y: 0 };
        const writeBlur = () => {
          blurNodes[key].setAttribute("stdDeviation", `${blurProxy.x} ${blurProxy.y}`);
        };
        writeBlur();

        tl.to(
          panel,
          {
            x: target.x * 0.1,
            y: target.y * 0.1,
            duration: 0.12,
            ease: "power3.in"
          },
          0
        );
        tl.to(
          panel,
          {
            x: target.x * 0.75,
            y: target.y * 0.75,
            duration: 0.10,
            ease: "none"
          },
          0.12
        );
        tl.to(
          panel,
          {
            x: target.x,
            y: target.y,
            duration: 0.33,
            ease: "power4.out"
          },
          0.22
        );
        tl.to(
          blurProxy,
          {
            x: 18,
            y: 10,
            duration: 0.12,
            ease: "power3.in",
            onUpdate: writeBlur
          },
          0
        );
        tl.to(
          blurProxy,
          {
            x: 0,
            y: 0,
            duration: 0.33,
            ease: "power4.out",
            onUpdate: writeBlur
          },
          0.22
        );
      });

      tl.fromTo(
        wordmark,
        { opacity: 0, y: 34, scale: 0.96, clipPath: "inset(0 100% 0 0)" },
        {
          opacity: 1,
          y: 0,
          scale: 1,
          clipPath: "inset(0 0% 0 0)",
          duration: 0.52,
          ease: "power3.out"
        },
        0.55
      );
      tl.fromTo(
        rail,
        { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power3.out" },
        0.78
      );
      tl.fromTo(
        sweep,
        { opacity: 0, x: -120 },
        { opacity: 0.28, x: 830, duration: 0.42, ease: "none" },
        0.72
      );
      tl.to(sweep, { opacity: 0, duration: 0.06, ease: "power1.in" }, 1.12);

      tl.to(
        wordmarkStage,
        {
          y: -190,
          scale: 0.62,
          duration: 0.48,
          ease: "power2.inOut"
        },
        1.20
      );

      gsap.set(terminal, { scaleX: 0.125, opacity: 1 });
      gsap.set(terminal.querySelector(".f05-run-the-roast-terminal-inner"), { opacity: 0 });
      gsap.set(proof, { opacity: 0, y: 28 });

      tl.to(
        terminal,
        {
          scaleX: 1,
          borderRadius: 55,
          backgroundColor: "#181615",
          duration: 0.62,
          ease: "power2.inOut"
        },
        1.20
      );
      tl.to(chip, { opacity: 0, scale: 0.84, duration: 0.25, ease: "power1.in" }, 1.20);
      tl.to(
        terminal.querySelector(".f05-run-the-roast-terminal-inner"),
        { opacity: 1, duration: 0.24, ease: "power1.out" },
        1.50
      );

      const sequence = [
        { t: 0.00, text: "", segment: "idle", color: "#f5f0e5" },
        { t: 1.52, text: "n", segment: "main", color: "#f5f0e5" },
        { t: 1.61, text: "npx", segment: "main", color: "#f5f0e5" },
        { t: 1.70, text: "npx ", segment: "main", color: "#f5f0e5" },
        { t: 1.79, text: "npx vibe", segment: "brand", color: "#18b98b" },
        { t: 1.90, text: "npx vibe-", segment: "brand", color: "#18b98b" },
        { t: 2.03, text: "npx vibe-roast", segment: "done", color: "#18b98b" }
      ];
      const entryAt = (time) => {
        for (let index = sequence.length - 1; index >= 0; index -= 1) {
          if (time >= sequence[index].t) return sequence[index];
        }
        return sequence[0];
      };
      const changeTimes = sequence
        .filter((entry, index) => index > 0 && entry.text !== sequence[index - 1].text)
        .map((entry) => entry.t);
      const typeDriver = { t: 0 };
      const blink = { p: 0 };

      tl.to(
        typeDriver,
        {
          t: 2.8,
          duration: 2.8,
          ease: "none",
          onUpdate: () => {
            const entry = entryAt(typeDriver.t);
            command.textContent = entry.text;
            caret.style.background = entry.color;
            const isTyping = changeTimes.some(
              (changeTime) => changeTime <= typeDriver.t && typeDriver.t - changeTime < 0.15
            );
            if (typeDriver.t < 1.48) {
              caret.style.opacity = "0";
            } else {
              caret.style.opacity = isTyping || Math.sin(blink.p) > 0 ? "1" : "0";
            }
          }
        },
        0
      );
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 4,
          duration: 2.8,
          ease: "none"
        },
        0
      );

      tl.fromTo(
        proof,
        { opacity: 0, y: 28 },
        { opacity: 1, y: 0, duration: 0.44, ease: "power2.out" },
        2.15
      );
    })();
  </script>
