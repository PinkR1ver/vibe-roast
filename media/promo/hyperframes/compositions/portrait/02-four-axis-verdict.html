  <script>
    (() => {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["02-four-axis-verdict"] = tl;

      const scanPath = document.getElementById("f02-four-axis-verdict-scan-path");
      const scanLength = scanPath.getTotalLength();
      scanPath.style.strokeDasharray = String(scanLength);
      scanPath.style.strokeDashoffset = String(scanLength);

      const connectorPaths = Array.from(
        document.querySelectorAll(".f02-four-axis-verdict-connector"),
      );
      connectorPaths.forEach((path) => {
        const length = path.getTotalLength();
        path.style.strokeDasharray = String(length);
        path.style.strokeDashoffset = String(length);
      });

      const lanes = ["m", "p", "s", "f"].map((key) => ({
        key,
        lane: document.getElementById(`f02-four-axis-verdict-lane-${key}`),
        letter: document.getElementById(`f02-four-axis-verdict-letter-${key}`),
        live: document.querySelector(
          `#f02-four-axis-verdict-letter-${key} .f02-four-axis-verdict-letter-live`,
        ),
        fill: document.getElementById(`f02-four-axis-verdict-fill-${key}`),
      }));

      const verdictBeats = [
        { key: "m", at: 0.5 },
        { key: "p", at: 0.86 },
        { key: "s", at: 1.22 },
        { key: "f", at: 1.58 },
      ];
      const pulseNodes = Array.from(
        document.querySelectorAll(".f02-four-axis-verdict-pulse"),
      );
      gsap.set(lanes.map((item) => item.lane), { opacity: 0 });
      gsap.set(lanes.map((item) => item.fill), { scaleX: 0 });

      tl.fromTo(
        "#f02-four-axis-verdict-status-text",
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.24, ease: "power2.out" },
        0.02,
      );
      tl.fromTo(
        "#f02-four-axis-verdict-spinner",
        { opacity: 0, scale: 0.92 },
        { opacity: 1, scale: 1, duration: 0.24, ease: "power2.out" },
        0.04,
      );
      tl.to(
        scanPath,
        { strokeDashoffset: 0, duration: 0.44, ease: "power2.out" },
        0.05,
      );

      const spinnerState = { degrees: 0 };
      tl.to(
        spinnerState,
        {
          degrees: 702,
          duration: 2.65,
          ease: "none",
          onUpdate: () => {
            document
              .getElementById("f02-four-axis-verdict-spinner-core")
              .setAttribute("transform", `rotate(${spinnerState.degrees} 40 40)`);
          },
        },
        0.05,
      );

      const cursorState = { phase: 0 };
      tl.to(
        cursorState,
        {
          phase: Math.PI * 10,
          duration: 2.65,
          ease: "none",
          onUpdate: () => {
            document.getElementById("f02-four-axis-verdict-status-cursor").style.opacity =
              Math.sin(cursorState.phase) > 0 ? "1" : "0";
          },
        },
        0.05,
      );

      verdictBeats.forEach((beat, beatIndex) => {
        const item = lanes.find((candidate) => candidate.key === beat.key);
        const previous = lanes.slice(0, beatIndex);
        const direction = beatIndex % 2 === 0 ? -1 : 1;

        tl.fromTo(
          pulseNodes[beatIndex],
          {
            opacity: 0.9,
            scale: 0.45,
            boxShadow: beat.key === "s"
              ? "0 0 0 0 rgba(239, 107, 74, 0.28)"
              : "0 0 0 0 rgba(24, 185, 139, 0.28)",
          },
          {
            opacity: 0,
            scale: 2.8,
            boxShadow: beat.key === "s"
              ? "0 0 0 34px rgba(239, 107, 74, 0)"
              : "0 0 0 34px rgba(24, 185, 139, 0)",
            duration: 0.32,
            ease: "power2.out",
          },
          beat.at - 0.03,
        );

        if (previous.length) {
          tl.to(
            previous.map((candidate) => candidate.lane),
            {
              y: "+=176",
              scale: 0.975,
              rotationZ: direction * 0.35,
              duration: 0.34,
              ease: "power3.inOut",
            },
            beat.at,
          );
        }

        tl.fromTo(
          item.lane,
          {
            opacity: 0,
            x: direction * 118,
            y: -82,
            z: -180,
            scale: 0.84,
            rotationX: -18,
            rotationZ: direction * 2.5,
            filter: "blur(10px)",
          },
          {
            opacity: 1,
            x: 0,
            y: 0,
            z: 0,
            scale: 1,
            rotationX: 0,
            rotationZ: 0,
            filter: "blur(0px)",
            backgroundColor: beat.key === "s" ? "#fbe2d9" : "#d4f9ef",
            duration: 0.42,
            ease: "back.out(1.45)",
          },
          beat.at,
        );

        const decodeState = { progress: 0 };
        tl.to(
          decodeState,
          {
            progress: 1,
            duration: 0.26,
            ease: "power3.out",
            onUpdate: () => {
              item.live.textContent = item.live.dataset.target;
              item.live.style.transform = `rotateX(${90 - decodeState.progress * 90}deg)`;
              item.live.style.opacity = String(Math.min(1, decodeState.progress * 2));
              item.live.style.filter = `blur(${(1 - decodeState.progress) * 5}px)`;
            },
          },
          beat.at,
        );
        tl.to(
          item.fill,
          { scaleX: 1, duration: 0.46, ease: "expo.out" },
          beat.at,
        );
      });

      tl.fromTo(
        "#f02-four-axis-verdict-receipt",
        { opacity: 0 },
        { opacity: 0.32, duration: 0.2, ease: "power1.out" },
        1.82,
      );

      const shellTargets = lanes.map((item) =>
        item.lane.querySelectorAll(
          ".f02-four-axis-verdict-lane-state, .f02-four-axis-verdict-lane-index, .f02-four-axis-verdict-track",
        ),
      );
      tl.to(
        shellTargets.flatMap((nodeList) => Array.from(nodeList)),
        { opacity: 0, duration: 0.2, ease: "power1.in" },
        1.95,
      );
      tl.to(
        lanes.map((item) => item.lane),
        {
          backgroundColor: "rgba(212, 249, 239, 0)",
          borderColor: "rgba(11, 17, 19, 0)",
          boxShadow: "0 0 0 rgba(11,17,19,0)",
          duration: 0.28,
          ease: "power2.inOut",
        },
        1.95,
      );

      const receiptY = { m: 570, p: 380, s: 190, f: 0 };
      const lockupX = { m: 135, p: 325, s: 515, f: 705 };
      lanes.forEach((item) => {
        tl.to(
          item.letter,
          {
            x: lockupX[item.key],
            y: 250 - receiptY[item.key],
            scale: 1.25,
            duration: 0.58,
            ease: "expo.inOut",
          },
          1.98,
        );
      });

      tl.fromTo(
        "#f02-four-axis-verdict-connectors",
        { opacity: 0 },
        { opacity: 1, duration: 0.18, ease: "power1.out" },
        2.04,
      );
      connectorPaths.forEach((path, index) => {
        tl.to(
          path,
          { strokeDashoffset: 0, duration: 0.36, ease: "power2.out" },
          2.04 + index * 0.04,
        );
      });
      tl.fromTo(
        "#f02-four-axis-verdict-lockup-frame",
        { opacity: 0, scaleX: 0.82 },
        { opacity: 1, scaleX: 1, duration: 0.4, ease: "expo.out" },
        2.18,
      );

      const statusStates = [
        { t: 0, text: "CLASSIFYING BEHAVIOR" },
        { t: 1.82, text: "CLASSIFYING" },
        { t: 2.3, text: "FINGERPRINT FOUND" },
      ];
      const statusDriver = { time: 0 };
      let lastStatus = "";
      tl.to(
        statusDriver,
        {
          time: 3.2,
          duration: 3.2,
          ease: "none",
          onUpdate: () => {
            let next = statusStates[0].text;
            for (let i = statusStates.length - 1; i >= 0; i -= 1) {
              if (statusDriver.time >= statusStates[i].t) {
                next = statusStates[i].text;
                break;
              }
            }
            if (next !== lastStatus) {
              document.getElementById("f02-four-axis-verdict-status-text").textContent = next;
              lastStatus = next;
            }
          },
        },
        0,
      );

      tl.to(
        "#f02-four-axis-verdict-connectors",
        { opacity: 0.34, duration: 0.24, ease: "power1.out" },
        2.48,
      );
      tl.to(
        "#f02-four-axis-verdict-receipt",
        { opacity: 0.12, duration: 0.24, ease: "power1.out" },
        2.48,
      );

      tl.fromTo(
        "#f02-four-axis-verdict-copy",
        { opacity: 0, y: 46 },
        { opacity: 1, y: 0, duration: 0.38, ease: "power4.out" },
        2.7,
      );
      tl.fromTo(
        "#f02-four-axis-verdict-copy-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.32, ease: "power2.out" },
        2.78,
      );
    })();
  </script>
</template>
