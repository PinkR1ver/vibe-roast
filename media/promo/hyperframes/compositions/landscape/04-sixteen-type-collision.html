  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });

    const figures = Array.from(
      document.querySelectorAll(".frame-04-sixteen-type-collision-figure")
    );
    const golden = Math.PI * (3 - Math.sqrt(5));

    const scatter = figures.map((figure, index) => {
      const angle = index * golden;
      const depthT = index / (figures.length - 1);
      return {
        x: Math.cos(angle) * (index < 4 ? 720 : 430),
        y: Math.sin(angle) * (index < 4 ? 110 : 350),
        z: 360 - depthT * 760,
        rotationX: Math.sin(angle) * 56,
        rotationY: Math.cos(angle) * 72
      };
    });

    figures.forEach((figure, index) => {
      tl.set(
        figure,
        {
          x: scatter[index].x,
          y: scatter[index].y,
          z: scatter[index].z,
          rotationX: scatter[index].rotationX,
          rotationY: scatter[index].rotationY,
          opacity: 0
        },
        0
      );
    });

    const streakStarts = [0.04, 0.18, 0.32, 0.46];
    const streakRunways = [-760, 780, -760, 780];
    for (let index = 0; index < 4; index += 1) {
      const figure = figures[index];
      const blurNode = document.getElementById(
        `frame-04-sixteen-type-collision-blur-${index}`
      );
      const blur = { value: 18 };
      const writeBlur = () => {
        blurNode.setAttribute("stdDeviation", `${blur.value} 0`);
      };
      writeBlur();

      tl.set(figure, { opacity: 1 }, streakStarts[index]);
      tl.fromTo(
        figure,
        {
          x: streakRunways[index],
          y: index % 2 === 0 ? -22 : 22,
          z: 210,
          rotationX: 0,
          rotationY: index % 2 === 0 ? -16 : 16
        },
        {
          x: 0,
          y: 0,
          z: 0,
          rotationX: 0,
          rotationY: 0,
          duration: 0.42,
          ease: "power4.out"
        },
        streakStarts[index]
      );
      tl.to(
        blur,
        {
          value: 0,
          duration: 0.42,
          ease: "power4.out",
          onUpdate: writeBlur
        },
        streakStarts[index]
      );
    }

    const waveOne = figures.slice(4, 8);
    const waveTwo = figures.slice(8, 12);
    [waveOne, waveTwo].forEach((wave, waveIndex) => {
      const waveStart = waveIndex === 0 ? 0.68 : 1.16;
      wave.forEach((figure, localIndex) => {
        const index = Number(figure.dataset.index);
        const arrival = waveStart + localIndex * 0.085;
        tl.set(figure, { opacity: 1 }, arrival);
        tl.to(
          figure,
          {
            x: 0,
            y: 0,
            z: 0,
            rotationX: 0,
            rotationY: 0,
            duration: 0.76,
            ease: localIndex % 2 === 0 ? "power3.out" : "expo.out"
          },
          arrival
        );
      });
    });

    const world = document.getElementById("frame-04-sixteen-type-collision-world");
    const camera = { scale: 1.18, x: 0, y: -42 };
    const applyCamera = () => {
      world.style.transform =
        `translate(${camera.x}px, ${camera.y}px) scale(${camera.scale})`;
    };
    applyCamera();

    tl.to(
      camera,
      {
        scale: 1,
        x: 0,
        y: 0,
        duration: 0.9,
        ease: "power3.inOut",
        onUpdate: applyCamera
      },
      1.75
    );

    figures.slice(12, 16).forEach((figure, localIndex) => {
      const index = Number(figure.dataset.index);
      const arrival = 1.78 + localIndex * 0.14;
      tl.set(figure, { opacity: 1 }, arrival);
      tl.to(
        figure,
        {
          x: localIndex % 2 === 0 ? -8 : 8,
          y: localIndex < 2 ? -6 : 6,
          z: 0,
          rotationX: 0,
          rotationY: 0,
          duration: 0.68,
          ease: localIndex % 2 === 0 ? "power3.out" : "expo.out"
        },
        arrival
      );
    });

    figures.slice(0, 12).forEach((figure, index) => {
      tl.to(
        figure,
        {
          x: index % 2 === 0 ? -5 : 5,
          y: index % 3 === 0 ? -4 : 4,
          duration: 0.34,
          ease: "power1.inOut"
        },
        2.22
      );
    });

    const codeStates = [
      { t: 0, values: ["", "", "", ""] },
      { t: 1.84, values: ["AOSF", "", "", ""] },
      { t: 2.02, values: ["AOSF", "MOVX", "", ""] },
      { t: 2.2, values: ["AOSF", "MOVX", "APVX", ""] },
      { t: 2.38, values: ["AOSF", "MOVX", "APVX", "MPSF"] }
    ];
    const codeElements = [
      document.getElementById("frame-04-sixteen-type-collision-code-a"),
      document.getElementById("frame-04-sixteen-type-collision-code-b"),
      document.getElementById("frame-04-sixteen-type-collision-code-c"),
      document.getElementById("frame-04-sixteen-type-collision-code-d")
    ];
    const codeDriver = { time: 0 };
    let lastCodeKey = "";
    const codeStateAt = (time) => {
      for (let index = codeStates.length - 1; index >= 0; index -= 1) {
        if (time >= codeStates[index].t) return codeStates[index];
      }
      return codeStates[0];
    };

    tl.to(
      codeDriver,
      {
        time: 3.2,
        duration: 3.2,
        ease: "none",
        onUpdate: () => {
          const state = codeStateAt(codeDriver.time);
          const key = state.values.join("|");
          if (key !== lastCodeKey) {
            codeElements.forEach((element, index) => {
              element.textContent = state.values[index];
              element.style.opacity = state.values[index] ? "1" : "0";
            });
            lastCodeKey = key;
          }
        }
      },
      0
    );

    tl.to(
      figures,
      {
        x: 0,
        y: 0,
        z: 0,
        rotationX: 0,
        rotationY: 0,
        duration: 0.14,
        ease: "power4.out",
        stagger: 0.006
      },
      2.65
    );

    tl.fromTo(
      "#frame-04-sixteen-type-collision-lockup",
      { y: 68, scale: 0.94, opacity: 0 },
      {
        y: 0,
        scale: 1,
        opacity: 1,
        duration: 0.2,
        ease: "power4.out"
      },
      2.65
    );

    window.__timelines["04-sixteen-type-collision"] = tl;
