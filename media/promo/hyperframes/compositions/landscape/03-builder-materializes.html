  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (() => {
      const compositionId = "03-builder-materializes";
      const world = document.getElementById("f03-builder-materializes-world");
      const stage = document.getElementById("f03-builder-materializes-stage");
      const cloud = document.getElementById("f03-builder-materializes-cloud");
      const relight = document.getElementById("f03-builder-materializes-relight");
      const evidence = document.getElementById("f03-builder-materializes-evidence");
      const scan = document.getElementById("f03-builder-materializes-scan");
      const fragments = Array.from(document.querySelectorAll(".f03-builder-materializes-frag"));
      const tags = Array.from(document.querySelectorAll(".f03-builder-materializes-tag"));

      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines[compositionId] = tl;

      const openingPose = { x: -150, y: -80, z: 160, rx: 6, ry: -7 };
      const divePose = { x: -510, y: -190, z: 620, rx: 34, ry: -12 };
      const builderPose = { x: -18, y: -28, z: 220, rx: 8, ry: -2 };
      const receiptPose = { x: 0, y: -112, z: 260, rx: 0, ry: 0 };
      const cam = { ...openingPose };

      const applyCamera = () => {
        world.style.transform =
          `translate3d(${cam.x}px, ${cam.y}px, ${cam.z}px) rotateX(${cam.rx}deg) rotateY(${cam.ry}deg)`;
      };
      applyCamera();

      gsap.set(evidence, { opacity: 0, x: 80, "--dof": "14px" });
      gsap.set(scan, { opacity: 0, scaleX: 0.18, y: 0 });
      gsap.set(relight, { opacity: 0 });

      const GOLDEN = Math.PI * (3 - Math.sqrt(5));
      const fragmentCount = fragments.length;
      const scatter = fragments.map((element, index) => {
        const angle = index * GOLDEN;
        const depthT = fragmentCount > 1 ? index / (fragmentCount - 1) : 0;
        return {
          x: Math.cos(angle) * 360,
          y: Math.sin(angle) * 310,
          z: 280 - depthT * 560,
          rotationX: Math.sin(angle) * 68,
          rotationY: Math.cos(angle) * 68
        };
      });
      fragments.forEach((element, index) => {
        gsap.set(element, { ...scatter[index], opacity: 0 });
      });

      tl.fromTo(
        cam,
        { ...openingPose },
        { ...divePose, duration: 0.62, ease: "power4.out", onUpdate: applyCamera },
        0
      );
      tl.fromTo(
        stage,
        { "--travel-blur": "0px" },
        { "--travel-blur": "18px", duration: 0.34, ease: "power3.in" },
        0.16
      );
      tl.to(stage, { "--travel-blur": "0px", duration: 0.28, ease: "expo.out" }, 0.50);
      tl.to(
        ".f03-builder-materializes-macro-layer",
        {
          opacity: 0,
          filter: "blur(18px)",
          duration: 0.24,
          ease: "power3.out"
        },
        0.62
      );

      tl.to(
        cam,
        { ...builderPose, duration: 0.72, ease: "power2.inOut", onUpdate: applyCamera },
        0.60
      );
      tl.fromTo(
        evidence,
        { opacity: 0, x: 80, "--dof": "14px" },
        { opacity: 0.58, x: 0, "--dof": "7px", duration: 0.54, ease: "power4.out" },
        0.58
      );
      tl.fromTo(
        scan,
        { opacity: 0, scaleX: 0.18, y: 0 },
        { opacity: 1, scaleX: 1, y: 0, duration: 0.22, ease: "power4.out" },
        0.61
      );
      tl.to(scan, { y: 900, duration: 0.68, ease: "power2.inOut" }, 0.73);
      tl.to(cloud, { rotationY: 24, duration: 0.44, ease: "power1.out" }, 0.48);

      fragments.forEach((element, index) => {
        tl.to(
          element,
          {
            x: Number(element.dataset.targetX),
            y: Number(element.dataset.targetY),
            z: 0,
            rotationX: 0,
            rotationY: 0,
            opacity: 1,
            duration: 0.46,
            ease: "power3.out"
          },
          0.48 + index * 0.035
        );
      });
      tl.to(cloud, { rotationY: 0, duration: 0.26, ease: "power2.out" }, 0.90);
      tl.to(relight, { opacity: 0.76, duration: 0.24, ease: "power2.out" }, 0.94);

      tl.to(
        cam,
        { ...receiptPose, duration: 0.40, ease: "power2.inOut", onUpdate: applyCamera },
        1.35
      );
      tl.to(evidence, { x: -52, "--dof": "13px", duration: 0.58, ease: "power2.inOut" }, 1.35);

      const content = [
        { element: document.getElementById("f03-builder-materializes-code"), body: "MPSF" },
        { element: document.getElementById("f03-builder-materializes-title"), body: "Builder" },
        {
          element: document.getElementById("f03-builder-materializes-roast"),
          body: "Converts short prompts into suspiciously fast demos"
        }
      ];
      let cumulative = 0;
      const contentTimeline = content.map((entry) => {
        const duration = 0.08 + entry.body.length * 0.004;
        const start = cumulative;
        cumulative += duration;
        return { ...entry, start, end: cumulative };
      });
      contentTimeline.forEach((entry) => {
        const cue = 1.35 + (entry.start / cumulative) * 0.62;
        tl.fromTo(
          entry.element,
          { opacity: 0, x: 190 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power4.out" },
          cue
        );
      });

      tags.forEach((tag, index) => {
        tl.fromTo(
          tag,
          { opacity: 0, y: 48, scale: 0.82 },
          {
            opacity: 1,
            y: 0,
            scale: 1,
            duration: 0.43,
            ease: "back.out(1.4)"
          },
          2.35 + index * 0.23
        );
      });
    })();
  </script>
