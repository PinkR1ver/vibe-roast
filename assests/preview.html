<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vibe Profile · MBTI flat figures</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f3f1ec;
        --ink: #1a1a1a;
        --muted: #6b6560;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px 24px 72px;
        background:
          radial-gradient(900px 500px at 0% 0%, #ffe8d6, transparent 55%),
          radial-gradient(800px 420px at 100% 10%, #d9fff3, transparent 50%),
          var(--bg);
        color: var(--ink);
        font-family: Outfit, sans-serif;
      }
      header { max-width: 1180px; margin: 0 auto 28px; }
      .kicker { color: #ff5a1f; font-size: 11px; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; }
      h1 { margin: 8px 0 12px; font-size: 34px; letter-spacing: -0.03em; }
      p { color: var(--muted); max-width: 760px; line-height: 1.65; }
      a { color: #ff5a1f; font-weight: 700; }
      .grid {
        max-width: 1180px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 28px;
      }
      .item { display: grid; gap: 12px; text-align: center; }
      .figure-stage {
        position: relative;
        padding: 18px 10px 8px;
        border-radius: 28px;
        background: transparent;
      }
      .figure-stage::before {
        content: "";
        position: absolute;
        inset: 8% 4% 12%;
        border-radius: 48% 52% 44% 56% / 50% 46% 54% 50%;
        background: radial-gradient(circle at 40% 35%, color-mix(in srgb, var(--accent, #23d6a5) 22%, #fff), transparent 60%);
        z-index: 0;
      }
      .figure-stage img {
        position: relative;
        z-index: 1;
        width: min(100%, 280px);
        height: auto;
        display: block;
        margin: 0 auto;
        border: 0;
        border-radius: 0;
        background: transparent;
        box-shadow: none;
      }
      .meta strong { font-size: 18px; }
      .meta span { display: block; color: var(--muted); font-size: 13px; margin-top: 4px; }
      .meta code { color: #ff5a1f; font-size: 12px; font-weight: 700; }
    </style>
  </head>
  <body>
    <header>
      <p class="kicker">MBTI flat vector · freestanding figures</p>
      <h1>8 Vibe Profiles (no card frame)</h1>
      <p>
        Result page: <a href="result.html">result.html</a> ·
        QA archive: <a href="review.html">review.html</a> ·
        Figures live as <code>*-figure.png</code> with soft abstract stage, not SBTI diamond cards.
      </p>
    </header>
    <section class="grid" id="grid"></section>
    <script>
      const items = [
        ["01-builder", "Builder", "SHIP", "Deploy first", "#23d6a5"],
        ["02-debugger", "Debugger", "HUNT", "Duck at midnight", "#ff6b9d"],
        ["03-architect", "Architect", "DRAW", "Boxes before bytes", "#5b8cff"],
        ["04-codex-believer", "Codex Believer", "FAITH", "Agent disciple", "#a78bfa"],
        ["05-prompt-priest", "Prompt Priest", "SPELL", "Rules scroll", "#f0c14a"],
        ["06-tab-hoarder", "Tab Hoarder", "TABS", "47 localhost tabs", "#ff8a3d"],
        ["07-context-maxxer", "Context Maxxer", "METER", "Gauge at 99%", "#22d3ee"],
        ["08-yolo-shipper", "YOLO Shipper", "YOLO", "Skip review merge", "#f04343"],
      ];
      const grid = document.getElementById("grid");
      for (const [folder, title, code, hook, accent] of items) {
        const name = folder.replace(/^\d+-/, "");
        grid.innerHTML += `<article class="item">
          <div class="figure-stage" style="--accent:${accent}">
            <img src="characters/${folder}/${name}-figure.png" width="384" height="512" alt="${title}" />
          </div>
          <div class="meta"><strong>${title}</strong><span>${hook}</span><code>${code}</code></div>
        </article>`;
      }
    </script>
  </body>
</html>
